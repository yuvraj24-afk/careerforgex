name: CareerForgeX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Test Suite (Vitest)
        run: npm run test

      - name: Production Build Check (Next.js)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "ci_pipeline_secret_test_32_characters_minimum"
